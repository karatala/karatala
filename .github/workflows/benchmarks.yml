name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BUILD_DIR: Builds
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  DISPLAY: :0
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_MULTIARCH: 1
  SCCACHE_IDLE_TIMEOUT: 0

defaults:
  run:
    shell: bash

jobs:
  benchmarks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest

    steps:
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Clang
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev xvfb ninja-build intel-oneapi-ipp-devel
          sudo /usr/bin/Xvfb "$DISPLAY" &

      - name: Install IPP (Windows)
        if: runner.os == 'Windows'
        run: nuget install intelipp.static.win-x64 -Version 2022.3.0.387

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache the Build
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: cmake -S . -B ${{ env.BUILD_DIR }} -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DKARATALA_BUILD_BENCHMARKS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Benchmarks
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} --target Benchmarks

      - name: Run Benchmarks
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          BENCHMARK_EXECUTABLE=./Benchmarks
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BENCHMARK_EXECUTABLE=./Benchmarks.exe
          fi
          "$BENCHMARK_EXECUTABLE" 2>&1 | tee benchmark-results.txt

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ runner.os }}
          path: ${{ env.BUILD_DIR }}/benchmark-results.txt
          if-no-files-found: ignore
