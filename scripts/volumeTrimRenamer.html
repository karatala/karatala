    .fill-height { height: 100vh; }
    .horiz { flex: 1; display: flex; flex-direction: column; }
    input,textarea { border: none; background: #eee; padding: 5px; margin: 2px; color: #7b7b7b }
    textarea:read-only { background: #fafafa; color: #a7a7a7 }
    textarea { height: 100%; resize: none; }
    button { margin: 0 2px; font-weight: bold; }

</head>
<body>

  <div class="container">

    </div>
    <div class="horiz fill-height">
      <pre>2). run</pre>
      <button onclick="generateCommands()">generate commands</button>
      <button onclick="downloadResult()">download result</button>
      <pre>copy result and use in terminal</pre>
      <textarea id="result" readonly></textarea>
    </div>
  </div>

  { regex: /snare-X2-center-....-oni/, db: -9 },
  { regex: /snare-X2-center-....-ons/, db: -7 },

function generateCommands() {
  const inputText = document.getElementById("input").value;
  const result = volumeTrimRenamer(inputText, rules);
  document.getElementById("result").value = result;
}

function downloadResult() {
  const resultString = document.getElementById("result").value;
  if (!resultString.trim()) {
    alert('result is empty, nothing to download');
    return;
  }
  const blob = new Blob([resultString], { type: 'text/plain' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'commands.txt';
  link.click();
}

let volumeTrimRenamer = (inputText, rules) => {
  const dbToTag = (db) => {
    const sign = db >= 0 ? 'p' : 'n';
    return `-v${sign}${Math.abs(db)}`;
  }
  const applyRule = (line, rule) => {
    const match = line.match(rule.regex);
    if (!match) return null;
    const tag = dbToTag(rule.db);
    let cleaned = line.replace(/-v[pn]\d+/, '');
    const idx = cleaned.indexOf(match[0]) + match[0].length;
    return cleaned.slice(0, idx) + tag + cleaned.slice(idx);
  }

  const lines = inputText.split(/\r?\n/);

  let commands = [];
  const ruleCounts = {};
  rules.forEach(rule => {
    ruleCounts[rule.regex.source] = 0;
  });

  let totalLines = 0;
  let matchedLines = 0;
  let unmatchedLines = 0;
  const unmatchedSamples = [];

  lines.forEach(line => {
    if (!line.trim()) return;
    totalLines++;
    let matched = false;
    for (const rule of rules) {
      const updated = applyRule(line, rule);
      if (updated) {
        const targetName = updated.replace(/^.*[\\\/]/, '');
        commands.push(`ren "${line}" "${targetName}"`);
        ruleCounts[rule.regex.source]++;
        matched = true;
        matchedLines++;
        break; // Only apply first matching rule
      }
    }
    if (!matched) {
      unmatchedLines++;
      if (unmatchedSamples.length < 5) {
        unmatchedSamples.push(line);
      }
    }
  });

  console.log(`Total lines processed: ${totalLines}`);
  console.log(`Lines that matched a rule: ${matchedLines}`);
  console.log(`Lines that didn't match any rule: ${unmatchedLines}`);
  if (unmatchedSamples.length > 0) {
    console.log('Sample unmatched lines:');
    unmatchedSamples.forEach(sample => console.log(sample));
  }

  console.log('Rules summary:');
  let matchedRules = 0;
  let unmatchedRules = 0;
  Object.entries(ruleCounts).forEach(([regex, count]) => {
    if (count > 0) {
      console.log(`${regex}: ${count} matches`);
      matchedRules++;
    } else {
      console.log(`${regex}: 0 matches`);
      unmatchedRules++;
    }
  });
  console.log(`Total rules: ${rules.length}, Matched: ${matchedRules}, Unmatched: ${unmatchedRules}`);

  return commands.join('\n');
}
